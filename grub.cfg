set timeout=0
set default=0
serial --unit=0 --speed=38400
terminal_output serial console
menuentry "Colloquy OS" {
    multiboot2 /boot/colloquy.elf
    # module2 <program> <name> [budget ticks/s] [manual = start later with: spawn]
    module2 /boot/shell.elf  shell  50
    module2 /boot/clock.elf  clock  10
    module2 /boot/scribe.elf scribe 10
    module2 /boot/hog.elf    hog    5
    module2 /boot/probe.elf  probe  10 manual
    boot
}
